name: Build and Push to ECR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-push-main
  cancel-in-progress: false

jobs:
  push-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/mealfit-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push AI server
        uses: docker/build-push-action@v6
        with:
          context: ./ai-server
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/mealfit-ai:${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/mealfit-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Show image tag
        run: echo "IMAGE_TAG=${{ github.sha }}"